services:
  - type: web
    name: quote-vault-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -e .
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
